
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi pequeño mundo de amor ❤️</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd1dc, #ff6f91);
      color: #7a1838;
    }
    .carta {
      background: white;
      margin: 20px;
      padding: 30px 22px;
      border-radius: 25px;
      box-shadow: 0 8px 25px #9c214455;
    }
    h1 { color: #e63966; }
    .corazon { font-size: 55px; }
    button {
      background: #e63966;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 14px 22px;
      font-size: 16px;
      cursor: pointer;
    }
    #mensaje {
      display: none;
      margin-top: 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="carta">
    <div class="corazon">❤️</div>
    <h1>Para mi persona favorita</h1>
    <p>Hay personas que llegan a nuestra vida y la hacen más bonita.</p>
    <p>Y tú eres una de esas personas especiales. 💕</p>
    <button onclick="mostrarMensaje()">Pulsa aquí, mi amor 💌</button>
    <div id="mensaje">
      <h2>Una pequeña sorpresa ❤️</h2>
      <p>Si pudiera pedir un deseo, sería seguir creando recuerdos bonitos contigo. Te quiero muchísimo. 🥹💕</p>
      <div>💗 💖 💗</div>
    </div>
  </main>
  <script>
    function mostrarMensaje() {
      document.getElementById("mensaje").style.display = "block";
    }
  </script>
</body>
</html>
